name: Tag release

# On every merge to main, create the next version tag. The CurseForge
# packaging webhook sees the new tag and builds a release file. The same
# run then builds per-game-version zips and publishes a GitHub release;
# Wago's webhook fires on that release and picks up the zips.
# (Tags pushed with GITHUB_TOKEN don't trigger other workflows, so the
# release is a job here rather than a separate on: push: tags workflow.)
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: tag-release

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create next tag
        id: tag
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Latest plain X.Y.Z tag (ignores alpha/beta tags)
          latest=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)

          if [ -z "$latest" ]; then
            # No releases yet: first release is the version being shipped now.
            next="1.0.1"
          else
            IFS=. read -r major minor patch <<< "$latest"
            # Include #major or #minor in the merge commit message to bump those;
            # otherwise the patch number is bumped.
            if   grep -qi '#major' <<< "$COMMIT_MSG"; then next="$((major + 1)).0.0"
            elif grep -qi '#minor' <<< "$COMMIT_MSG"; then next="${major}.$((minor + 1)).0"
            else next="${major}.${minor}.$((patch + 1))"
            fi
          fi

          echo "Tagging $next"
          git tag "$next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}

      # Wago's "Multiple" game version mode keys off the zip suffix:
      # Retail has none, Forever ends in -forever.zip. Both zips hold the same
      # files, since the .toc lists both Interface versions.
      - name: Build zips
        env:
          VERSION: ${{ needs.tag.outputs.tag }}
        run: |
          mkdir -p build/AltSort
          cp AltSort.lua AltSort.toc Bindings.xml build/AltSort/
          sed -i "s/@project-version@/${VERSION}/" build/AltSort/AltSort.toc
          cd build
          zip -r "AltSort-${VERSION}.zip" AltSort
          cp "AltSort-${VERSION}.zip" "AltSort-${VERSION}-forever.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.tag }}
        run: |
          gh release create "$VERSION" \
            "build/AltSort-${VERSION}.zip" \
            "build/AltSort-${VERSION}-forever.zip" \
            --title "$VERSION" --generate-notes
